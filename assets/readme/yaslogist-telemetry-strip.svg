<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 88" width="1200" height="88" role="img" aria-label="3D-Containers procedural engineering telemetry strip">
  <defs>
    <linearGradient id="ts-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090c10"/>
      <stop offset="50%" stop-color="#0f141b"/>
      <stop offset="100%" stop-color="#090c10"/>
    </linearGradient>
    <linearGradient id="ts-scan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5ce1e6" stop-opacity="0"/>
      <stop offset="45%" stop-color="#5ce1e6" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#ffb020" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffb020" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ts-clip">
      <rect x="2" y="2" width="1196" height="84" rx="6"/>
    </clipPath>
  </defs>

  <rect x="2" y="2" width="1196" height="84" rx="6" fill="url(#ts-bg)" stroke="#232c36" stroke-width="1.2"/>

  <g clip-path="url(#ts-clip)">
    <!-- Subtle top optical scan beam -->
    <rect x="-360" y="2" width="360" height="2" fill="url(#ts-scan)">
      <animate attributeName="x" values="-360;1200" dur="6.5s" repeatCount="indefinite"/>
    </rect>
    <!-- Bottom fine amber/slate rule -->
    <line x1="2" y1="85" x2="1198" y2="85" stroke="#19212a" stroke-width="1"/>
  </g>

  <!-- Vertical column dividers -->
  <line x1="302" y1="16" x2="302" y2="72" stroke="#222b35" stroke-width="1"/>
  <line x1="600" y1="16" x2="600" y2="72" stroke="#222b35" stroke-width="1"/>
  <line x1="898" y1="16" x2="898" y2="72" stroke="#222b35" stroke-width="1"/>

  <!-- CELL 1: GEOMETRY KERNEL -->
  <g transform="translate(24, 0)">
    <circle cx="8" cy="27" r="4" fill="#6fbf8f">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="8" cy="27" r="7.5" fill="none" stroke="#6fbf8f" stroke-width="1" opacity="0.35">
      <animate attributeName="r" values="5;9;5" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.05;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="31" fill="#ffb020" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1.4">01 // GEOMETRY KERNEL</text>
    <text x="8" y="54" fill="#eef3f7" font-family="'Chakra Petch', 'Segoe UI', system-ui, sans-serif" font-size="14.5" font-weight="700" letter-spacing="0.4">CCW offsetPolygon() Solids</text>
    <text x="8" y="71" fill="#8b99a7" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5">Zero external .glb / .png files</text>
  </g>

  <!-- CELL 2: CERTIFIED ULD FLEET -->
  <g transform="translate(322, 0)">
    <rect x="4" y="23" width="8" height="8" rx="1.5" fill="#5ce1e6">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="3.2s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <text x="20" y="31" fill="#5ce1e6" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1.4">02 // CERTIFIED ULD FLEET</text>
    <text x="4" y="54" fill="#eef3f7" font-family="'Chakra Petch', 'Segoe UI', system-ui, sans-serif" font-size="14.5" font-weight="700" letter-spacing="0.4">17 Certified ULD Families</text>
    <text x="4" y="71" fill="#8b99a7" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5">IATA AHM / SAE AS1811 envelopes</text>
  </g>

  <!-- CELL 3: REAL-TIME SHADING -->
  <g transform="translate(620, 0)">
    <rect x="4" y="23" width="8" height="8" rx="1.5" fill="#ffb020">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="3.2s" begin="1.3s" repeatCount="indefinite"/>
    </rect>
    <text x="20" y="31" fill="#ffb020" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1.4">03 // REAL-TIME WEBGL PBR</text>
    <text x="4" y="54" fill="#eef3f7" font-family="'Chakra Petch', 'Segoe UI', system-ui, sans-serif" font-size="14.5" font-weight="700" letter-spacing="0.4">Three.js r180 · ACES Filmic</text>
    <text x="4" y="71" fill="#8b99a7" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5">5 procedural Canvas PBR finishes</text>
  </g>

  <!-- CELL 4: CAD & SINGLEFILE I/O -->
  <g transform="translate(918, 0)">
    <rect x="4" y="23" width="8" height="8" rx="1.5" fill="#8ff5dc">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="3.2s" begin="2.1s" repeatCount="indefinite"/>
    </rect>
    <text x="20" y="31" fill="#8ff5dc" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1.4">04 // NATIVE CAD EXPORT</text>
    <text x="4" y="54" fill="#eef3f7" font-family="'Chakra Petch', 'Segoe UI', system-ui, sans-serif" font-size="14.5" font-weight="700" letter-spacing="0.4">GLB · OBJ · STL + Raw TS</text>
    <text x="4" y="71" fill="#8b99a7" font-family="'IBM Plex Mono', 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5">1:1 metre-scale watertight meshes</text>
  </g>
</svg>
