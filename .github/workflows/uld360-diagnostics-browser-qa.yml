name: Temporary ULD360 Carton Diagnostics Browser QA

on:
  push:
    branches: [feat/uld360-carton-diagnostics-20261123]
    paths: [.github/workflows/uld360-diagnostics-browser-qa.yml]

permissions:
  contents: read

jobs:
  responsive-cargo-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium and project dependencies
        run: |
          npm ci
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local app
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/uld360-vite.log 2>&1 &
          for i in {1..45}; do curl -fsS http://127.0.0.1:4173/ > /dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:4173/ > /dev/null
      - name: Test carton acceptance, rejection, explanations and CSV download
        run: |
          cat > diagnostics-qa.mjs <<'JS'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const profiles = [
            {name:'phone',viewport:{width:390,height:844},dpr:3,mobile:true},
            {name:'tablet',viewport:{width:1024,height:1366},dpr:2,mobile:true},
            {name:'desktop',viewport:{width:1440,height:900},dpr:2,mobile:false},
          ];
          try {
            for (const device of profiles) {
              const context=await browser.newContext({
                viewport:device.viewport,deviceScaleFactor:device.dpr,
                isMobile:device.mobile,hasTouch:device.mobile,acceptDownloads:true,
                reducedMotion:'reduce',
              });
              const page=await context.newPage();
              page.setDefaultTimeout(25000);
              const errors=[];page.on('pageerror',error=>errors.push(error.message));
              try {
                const response=await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000});
                assert.equal(response?.status(),200);
                await page.locator('canvas').first().waitFor();
                const load=page.getByRole('button',{name:'Load 3D cargo preview'});
                await load.click();
                await page.getByRole('button',{name:'Edit the cargo manifest'}).click();
                const panel=page.getByRole('region',{name:'Carton diagnostics'});
                await panel.waitFor({state:'visible'});
                assert.match(await panel.innerText(),/27 placed.*0 not placed.*27 submitted/);
                await panel.getByRole('button',{name:'Placed (27)'}).click();
                const placed=panel.locator('article');
                assert.equal(await placed.count(),27);
                await placed.first().locator('summary').click();
                assert.match(await placed.first().innerText(),/Core-relative centre/);
                await panel.getByRole('button',{name:'All (27)'}).click();

                await page.getByRole('spinbutton',{name:'Width (m)'}).fill('12');
                await page.getByRole('button',{name:'+ add carton'}).click();
                await panel.getByRole('button',{name:'Not placed (1)'}).click();
                assert.equal(await panel.locator('article').count(),1);
                assert.match(await panel.innerText(),/Outside conservative preview core/);
                await panel.locator('summary').first().click();
                const detail=await panel.innerText();
                assert.match(detail,/Exceeded: width/);
                assert.match(detail,/not validated/);
                const [download]=await Promise.all([
                  page.waitForEvent('download'),
                  panel.getByRole('button',{name:'export CSV'}).click(),
                ]);
                assert.match(download.suggestedFilename(),/uld360-ake-carton-diagnostics\.csv$/);
                const width=await page.evaluate(()=>document.documentElement.scrollWidth);
                assert.ok(width <= device.viewport.width+2,device.name+' horizontal overflow: '+width);
                assert.deepEqual(errors,[],device.name+' JS errors');
                console.log('PASS',device.name,'placed, details, rejection, filter, CSV, no-overflow, no-pageerror');
              } finally {
                await context.close();
              }
            }
          } finally {await browser.close();}
          JS
          node diagnostics-qa.mjs
