name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.19.x", "22.x"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Geometry and registry checks
        run: npm test

      - name: Type-check and build single-file app
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Upload standalone HTML
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: 3d-containers-single-file
          path: dist/index.html
          if-no-files-found: error
