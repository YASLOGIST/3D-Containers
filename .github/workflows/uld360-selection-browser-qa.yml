name: Temporary ULD360 Carton Selection Browser QA

on:
  push:
    branches: [feat/uld360-linked-carton-highlighting-20261123]
    paths: [.github/workflows/uld360-selection-browser-qa.yml]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project and Chromium
        run: |
          npm ci
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start preview server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/uld360-vite.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
      - name: Check linked 3D highlight, clear and stale selection
        run: |
          cat > qa-carton-select.mjs <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({
            headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']
          });
          const profiles=[
            {name:'phone',viewport:{width:390,height:844},dpr:3,mobile:true},
            {name:'tablet',viewport:{width:1024,height:1366},dpr:2,mobile:true},
            {name:'desktop',viewport:{width:1440,height:900},dpr:2,mobile:false},
          ];
          try{
            for(const device of profiles){
              const ctx=await browser.newContext({
                viewport:device.viewport,deviceScaleFactor:device.dpr,
                isMobile:device.mobile,hasTouch:device.mobile,reducedMotion:'reduce'
              });
              const page=await ctx.newPage();page.setDefaultTimeout(24000);
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              try{
                const response=await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000});
                assert.equal(response?.status(),200);
                await page.locator('canvas').first().waitFor();
                const load=page.getByRole('button',{name:'Load 3D cargo preview'});
                await load.click();
                await page.getByRole('button',{name:'Edit the cargo manifest'}).click();
                const locate=page.getByRole('button',{name:'Highlight Demo 01 in 3D'});
                await locate.click();
                const badge=page.getByTestId('selected-cargo-indicator');
                await badge.waitFor({state:'visible'});
                assert.match(await badge.innerText(),/Demo 01/);
                assert.match(await badge.innerText(),/25\.0 kg/);
                assert.equal(await page.locator('canvas').count(),1);
                await page.getByRole('button',{name:'Clear highlighted carton'}).click();
                await badge.waitFor({state:'hidden'});
                await page.getByRole('button',{name:'Edit the cargo manifest'}).click();
                await page.getByRole('button',{name:'Highlight Demo 01 in 3D'}).click();
                await badge.waitFor({state:'visible'});
                await page.getByRole('button',{name:'Edit the cargo manifest'}).click();
                // Both responsive panels exist in DOM; click the *visible* control.
                const removeVisible=page.locator('button[title="Remove Demo 01"]:visible');
                assert.equal(await removeVisible.count(),1,'One remove control must be visible');
                await removeVisible.click();
                await badge.waitFor({state:'hidden'});
                const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2);
                assert.equal(overflow,false,'No horizontal overflow');
                assert.deepEqual(errors,[],'No JavaScript errors');
                console.log('PASS',device.name,'select, badge, clear, remove, canvas, overflow, errors');
              }finally{await ctx.close();}
            }
          }finally{await browser.close();}
          JS
          node qa-carton-select.mjs
