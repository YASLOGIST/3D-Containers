name: Temporary ULD360 Mass Zone Browser QA

on:
  push:
    branches: [feat/uld360-mass-zone-inspector-20261123]
    paths: [.github/workflows/uld360-zone-browser-qa.yml]

permissions:
  contents: read

jobs:
  responsive-zone-inspection:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm ci
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local development server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/uld360-vite.log 2>&1 &
          for i in {1..45}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
      - name: Inspect mass zones and locate contributor in 3D across viewports
        run: |
          cat > qa-mass-zones.mjs <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,args:[
            '--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'
          ]});
          const profiles=[
            {name:'phone',viewport:{width:390,height:844},dpr:3,mobile:true},
            {name:'tablet',viewport:{width:1024,height:1366},dpr:2,mobile:true},
            {name:'desktop',viewport:{width:1440,height:900},dpr:2,mobile:false},
          ];
          try{
            for(const device of profiles){
              const context=await browser.newContext({
                viewport:device.viewport,deviceScaleFactor:device.dpr,
                isMobile:device.mobile,hasTouch:device.mobile,reducedMotion:'reduce'
              });
              const page=await context.newPage();page.setDefaultTimeout(24000);
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              try{
                const r=await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000});
                assert.equal(r?.status(),200);
                await page.locator('canvas').first().waitFor();
                await page.getByRole('button',{name:'Load 3D cargo preview'}).click();
                await page.getByRole('button',{name:/lenses/i}).first().click();
                const zones=page.getByRole('group',{name:'Inspect nine projected mass zones'});
                await zones.waitFor({state:'visible'});
                assert.equal(await zones.getByRole('button').count(),9);
                const firstZone=zones.getByRole('button',{name:/Inspect zone row 1 column 1,/i});
                await firstZone.click();
                assert.equal(await firstZone.getAttribute('aria-pressed'),'true');
                const detail=page.getByRole('region',{name:'Selected mass zone breakdown'});
                await detail.waitFor({state:'visible'});
                const description=await detail.innerText();
                assert.match(description,/Zone R1 \/ C1/);
                assert.match(description,/kg projected/);
                assert.match(description,/kg\/m² index/);
                assert.match(description,/contributing cartons/);
                assert.match(description,/not a contact-force/i);
                await detail.getByRole('button',{name:/Highlight Demo 01 contributing to zone in 3D/}).click();
                const badge=page.getByTestId('selected-cargo-indicator');
                await badge.waitFor({state:'visible'});
                assert.match(await badge.innerText(),/Demo 01/);
                await page.getByRole('button',{name:'Clear highlighted carton'}).click();
                await badge.waitFor({state:'hidden'});
                await page.getByRole('button',{name:/lenses/i}).first().click();
                const refreshed=page.getByRole('group',{name:'Inspect nine projected mass zones'});
                const reopened=page.getByRole('region',{name:'Selected mass zone breakdown'});
                // Desktop keeps the studio mounted, while the mobile sheet unmounts.
                if (await reopened.count() === 0) {
                  await refreshed.getByRole('button',{name:/Inspect zone row 1 column 1,/i}).click();
                }
                await reopened.getByRole('button',{name:'Close selected mass zone'}).click();
                await page.getByRole('region',{name:'Selected mass zone breakdown'}).waitFor({state:'hidden'});
                const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2);
                assert.equal(overflow,false,'Unexpected horizontal overflow on '+device.name);
                assert.deepEqual(errors,[],'JavaScript errors on '+device.name);
                console.log('PASS',device.name,'9 zones, contributor, 3D focus, clear, no overflow, no errors');
              } finally {await context.close();}
            }
          }finally{await browser.close();}
          JS
          node qa-mass-zones.mjs
