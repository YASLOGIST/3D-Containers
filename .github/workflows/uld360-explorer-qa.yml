name: Temporary ULD360 Explorer Browser QA

on:
  push:
    branches: [feat/uld360-model-explorer-20261123]
    paths: [.github/workflows/uld360-explorer-qa.yml]

permissions:
  contents: read

jobs:
  explorer-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser dependencies
        run: |
          npm ci
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local app
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/uld360-explorer-vite.log 2>&1 &
          for i in {1..45}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
      - name: Model search, specs, controls, keyboard and mobile flow
        run: |
          cat > qa-explorer.mjs <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          import {mkdirSync} from 'node:fs';
          mkdirSync('qa-evidence',{recursive:true});
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const cases=[
            {id:'phone',width:390,height:844,dpr:3,touch:true},
            {id:'tablet',width:1024,height:1366,dpr:2,touch:true},
            {id:'desktop',width:1440,height:900,dpr:2,touch:false},
          ];
          try {
            for(const config of cases){
              const ctx=await browser.newContext({
                viewport:{width:config.width,height:config.height},
                deviceScaleFactor:config.dpr,
                isMobile:config.touch,
                hasTouch:config.touch,
                reducedMotion:'reduce',
                permissions:['clipboard-read','clipboard-write'],
              });
              const p=await ctx.newPage();
              const errors=[];p.on('pageerror',e=>errors.push(e.message));
              p.setDefaultTimeout(20000);
              const response=await p.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000});
              assert.equal(response?.status(),200);
              await p.getByRole('button',{name:'Browse 17 ULD models and technical references'}).click();
              const dialog=p.getByRole('dialog',{name:'Model Explorer'});
              assert.ok(await dialog.isVisible(),'Explorer opens as an accessible dialog');
              assert.equal(await dialog.getByRole('button',{name:/^Preview /}).count(),17,'All 17 registry models visible');
              const box=dialog.getByRole('searchbox',{name:'Search ULD models by code, family, or aircraft'});
              await box.fill('RKN');
              await dialog.getByText('1 of 17 registry models').waitFor({state:'visible'});
              await dialog.getByRole('button',{name:'Refrigerated',exact:true}).click();
              await dialog.getByText('1 of 17 registry models').waitFor({state:'visible'});
              await dialog.getByRole('button',{name:'Copy specs'}).click();
              await dialog.getByText('Reference brief copied',{exact:true}).waitFor({state:'visible',timeout:6000});
              const clip=await p.evaluate(()=>navigator.clipboard.readText());
              assert.ok(clip.includes('RKN')&&clip.includes('NOT an OEM-approved'),'Reference brief includes source and disclaimer');
              await dialog.getByRole('button',{name:'All',exact:true}).click();
              await box.fill('');
              if(config.id!=='desktop'){
                await dialog.screenshot({path:'qa-evidence/explorer-'+config.id+'.png',animations:'disabled',timeout:30000});
              }
              await p.keyboard.press('Escape');
              assert.equal(await dialog.isVisible(),false,'Escape dismisses explorer');
              assert.ok((await p.getByRole('button',{name:'Browse 17 ULD models and technical references'}).getAttribute('aria-expanded'))==='false');
              await p.getByRole('button',{name:'Browse 17 ULD models and technical references'}).click();
              const again=p.getByRole('dialog',{name:'Model Explorer'});
              await again.getByRole('searchbox').fill('RKN');
              await again.getByRole('button',{name:'Open model in 3D'}).click();
              assert.equal(await p.getByRole('dialog').count(),0,'Inspect closes dialog');
              await p.getByRole('heading',{level:1}).getByText('RKN').waitFor({timeout:25000});
              if(config.id==='phone'){
                await p.getByRole('button',{name:'Browse 17 ULD models and technical references'}).click();
                const compare=p.getByRole('dialog',{name:'Model Explorer'});
                await compare.getByRole('searchbox').fill('DPE');
                await compare.getByRole('button',{name:'Compare with RKN'}).click();
                assert.equal(await p.getByRole('dialog').count(),0);
                await p.getByText('reference comparison · RKN vs DPE',{exact:false}).last().waitFor({timeout:25000});
              }
              const overflow=await p.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+2);
              assert.equal(overflow,false,'No horizontal overflow on '+config.id);
              assert.deepEqual(errors,[],'No browser JS exception on '+config.id);
              console.log('PASS',config.id,'search/copy/open',config.id==='phone'?'compare':'','no overflow or JS errors');
              await ctx.close();
            }
          } finally {await browser.close()}
          JS
          node qa-explorer.mjs
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ULD360-Model-Explorer-QA
          path: qa-evidence/*.png
          if-no-files-found: warn
          retention-days: 3
