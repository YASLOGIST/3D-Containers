name: Temporary ULD360 Video Export

on:
  push:
    paths:
      - .github/workflows/uld360-video-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install recording dependencies
        run: |
          npm ci
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Record live ULD360 engineering scenes
        run: |
          cat > video-capture.mjs <<'JS'
          import {chromium} from 'playwright';
          import {mkdirSync,renameSync} from 'node:fs';
          mkdirSync('video-out',{recursive:true});
          const browser=await chromium.launch({headless:true,args:['--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const scenes=[
            {id:'hero',preset:'hero',duration:4000},
            {id:'teardown',preset:'TECH TEARDOWN',duration:3700},
            {id:'cutaway',preset:'CUTAWAY',duration:3400},
            {id:'cargo',preset:'LOAD 3D',duration:4600},
            {id:'field',preset:'MASS FIELD',duration:4100},
          ];
          try{
           for(const scene of scenes){
             const ctx=await browser.newContext({viewport:{width:1600,height:900},recordVideo:{dir:'video-out',size:{width:1600,height:900}}});
             const page=await ctx.newPage();
             try{
               const r=await page.goto('https://containers.yaslogist.com/',{waitUntil:'domcontentloaded',timeout:30000});
               if(r?.status()!==200)throw Error('Website status: '+r?.status());
               await page.waitForSelector('canvas',{timeout:30000});
               await page.waitForTimeout(2100);
               if(scene.preset==='LOAD 3D')await page.getByRole('button',{name:/LOAD 3D/i}).first().click();
               else if(scene.preset==='MASS FIELD'){
                 await page.getByRole('button',{name:/LOAD 3D/i}).first().click();
                 await page.getByRole('button',{name:/lenses/i}).first().click();
                 await page.getByRole('button',{name:/MASS FIELD/i}).first().click();
               }else if(scene.preset!=='hero'){
                 await page.getByRole('button',{name:/lenses/i}).first().click();
                 await page.getByRole('button',{name:new RegExp(scene.preset,'i')}).first().click();
               }
               if(scene.preset!=='MASS FIELD')await page.getByRole('button',{name:/focus/i}).first().click();
               await page.waitForTimeout(700);
               const labels={hero:'01 / MODEL EXPLORATION',teardown:'02 / TECH TEARDOWN',cutaway:'03 / CUTAWAY VIEW',cargo:'04 / CARGO LOADING',field:'05 / MASS DISTRIBUTION'};
               await page.evaluate(label=>{
                 const el=document.createElement('div');el.textContent=label;
                 el.style.cssText='position:fixed;z-index:99999;bottom:65px;left:35px;pointer-events:none;padding:18px 32px;background:#081b2de8;border-left:5px solid #4bd6f1;color:white;font:700 23px Arial,sans-serif;letter-spacing:2px';
                 document.body.appendChild(el);
               },labels[scene.id]);
               await page.screenshot({path:'video-out/'+scene.id+'.png'});
               await page.mouse.move(790,480);
               for(let i=0;i<5;i++){
                 if(i<3)await page.mouse.wheel(0,-25);
                 await page.waitForTimeout(scene.duration/5);
               }
               if(scene.preset==='MASS FIELD' && !(await page.locator('body').innerText()).includes('675.0 kg'))throw Error('Mass result missing');
               const video=page.video();await page.close();
               renameSync(await video.path(),'video-out/'+scene.id+'.webm');
               await ctx.close();console.log('Captured',scene.id);
             }catch(error){await page.close().catch(()=>{});await ctx.close().catch(()=>{});throw error}
           }
           const p=await browser.newPage({viewport:{width:1600,height:900}});
           const closing='<html><body style="background:radial-gradient(ellipse at 70% 45%,#15495e,#071721 68%);font-family:Arial;color:white;margin:0;width:1600px;height:900px"><div style="padding:120px 110px"><div style="font-size:37px;letter-spacing:4px;font-weight:bold">YASLOGIST / AIR CARGO &amp; AVIATION</div><div style="font-size:160px;font-weight:900;margin-top:110px">ULD<span style="color:#58d4ed">360</span></div><div style="font-size:32px;font-weight:bold;letter-spacing:4px;margin-top:25px">SEE BEYOND THE SKIN.</div><div style="font-size:32px;color:#9edcf2;margin-top:105px">containers.yaslogist.com</div><div style="font-size:16px;color:#99b7c4;margin-top:42px">ENGINEERING VISUALIZATION — NOT A CERTIFIED LOADING SYSTEM</div></div></body></html>';
           await p.setContent(closing);await p.screenshot({path:'video-out/endcard.png'});await p.close();
          }finally{await browser.close()}
          JS
          node video-capture.mjs
      - name: Edit LinkedIn H.264 video
        run: |
          cat > compose.py <<'PY'
          import subprocess
          names=['hero','teardown','cutaway','cargo','field']
          begins=[3.0]*5
          lens=[3.8,3.6,3.2,4.3,3.8]
          final=2.7
          overlap=.28
          ins=[]
          for n in names:ins+=['-i',f'video-out/{n}.webm']
          ins+=['-loop','1','-framerate','25','-t',str(final),'-i','video-out/endcard.png']
          filters=[]
          for i in range(5):
            filters.append(f'[{i}:v]trim=start={begins[i]}:duration={lens[i]},setpts=PTS-STARTPTS,fps=25,scale=1280:720,setsar=1,format=yuv420p,settb=AVTB[s{i}]')
          filters.append(f'[5:v]trim=duration={final},setpts=PTS-STARTPTS,fps=25,scale=1280:720,setsar=1,format=yuv420p,settb=AVTB[s5]')
          total=lens[0];last='s0'
          for i in range(1,6):
            out='x'+str(i)
            filters.append(f'[{last}][s{i}]xfade=transition=fade:duration={overlap}:offset={total-overlap:.2f}[{out}]')
            total+=(lens[i] if i<5 else final)-overlap
            last=out
          filters.append(f'[{last}]fade=t=in:st=0:d=.2,fade=t=out:st=19.65:d=.35,format=yuv420p[v]')
          cmd=['ffmpeg','-y','-hide_banner','-loglevel','error']+ins+['-filter_complex',';'.join(filters),'-map','[v]','-an','-t','20','-c:v','libx264','-preset','fast','-crf','20','-pix_fmt','yuv420p','-r','25','-movflags','+faststart','video-out/ULD360_LinkedIn_Demo_20s.mp4']
          subprocess.run(cmd,check=True)
          subprocess.run(['ffprobe','-v','error','-show_entries','format=duration,size:stream=codec_name,width,height,avg_frame_rate','-of','default=noprint_wrappers=1','video-out/ULD360_LinkedIn_Demo_20s.mp4'],check=True)
          PY
          python3 compose.py
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: ULD360-LinkedIn-Video
          path: |
            video-out/ULD360_LinkedIn_Demo_20s.mp4
            video-out/hero.png
            video-out/teardown.png
            video-out/cutaway.png
            video-out/cargo.png
            video-out/field.png
            video-out/endcard.png
          if-no-files-found: error
          retention-days: 7
